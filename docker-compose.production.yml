services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pcmo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]

  migrate:
    build: .
    env_file: .env.production
    command: ["npm", "run", "db:migrate:prod"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      MYSQL_HOST: mysql
    volumes:
      - pcmo_uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  pcmo_mysql_data:
  pcmo_uploads:
  caddy_data:
  caddy_config:
