services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pcmo-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pcmo}
      MYSQL_USER: ${MYSQL_USER:-pcmo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pcmo-password}
    ports:
      - "3306:3306"
    volumes:
      - pcmo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-pcmo-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pcmo_mysql_data:
